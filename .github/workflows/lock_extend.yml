name: Weekly Lock Re-extend

on:
  schedule:
    # Once a week, Saturday ~11:00am ET (EDT, UTC-4 -- shifts an hour earlier during
    # EST/winter, same caveat as the nightly tap's schedule: GitHub's scheduler doesn't
    # follow DST). A single fixed time, not a retry window like the nightly tap -- this
    # isn't racing a daily unlock, so there's no need for one.
    - cron: "0 15 * * 6"
  workflow_dispatch: {}

# Same session lock as the nightly tap (maintenance.yml): both scripts use the same
# saved cookies and GoMining rotates the refresh token on every use, so they must never
# run at the same time. cancel-in-progress: false so a run already in progress (e.g. the
# Friday-night tap window bleeding past midnight) is never interrupted -- this one just
# queues behind it.
concurrency:
  group: gomining-session
  cancel-in-progress: false

jobs:
  extend-locks:
    runs-on: ubuntu-latest
    # Re-extending each qualifying position is a few more page loads per account on top
    # of the normal tap; generous headroom over that, same reasoning as maintenance.yml's
    # timeout (fail fast and loud instead of hanging for hours on a stuck step).
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 2
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore the saved GoMining login (Actions cache)
        # Cache mode only (COOKIE_STORE=cache, set per-repo by the setup wizard): GoMining
        # rotates the login every time it is used, so each run saves the new one for the next.
        # This restores whatever was saved last; restore-keys' prefix picks the MOST RECENTLY
        # created entry. In secret mode (this repo's own default) it just finds nothing to
        # restore and the script ignores it.
        uses: actions/cache/restore@v4
        with:
          path: cookie-cache
          key: gomining-login-restore-only
          restore-keys: |
            gomining-login-

      - name: Run maintenance script (with weekly lock re-extend)
        id: tap
        env:
          GOMINING_ACCOUNT_LABELS: PRIMARY,SECONDARY
          GOMINING_COOKIES_PRIMARY: ${{ secrets.GOMINING_COOKIES_PRIMARY }}
          GOMINING_COOKIES_SECONDARY: ${{ secrets.GOMINING_COOKIES_SECONDARY }}
          # Cache mode: keep the rotated login in the Actions cache, encrypted with this
          # key, instead of a personal access token. Switched over 2026-09-29.
          COOKIE_STORE: cache
          COOKIE_CACHE_KEY: ${{ secrets.COOKIE_CACHE_KEY }}
          CALC_REPO: jdobbsclt/gomining-flywheel-calculator
          CALC_REPO_TOKEN: ${{ secrets.CALC_REPO_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Turns on the lock re-extend step in gomining_maintenance.py -- unset in
          # maintenance.yml, so the nightly tap never touches locks. The daily tap's
          # own button click also runs here (same script), but it's a harmless no-op
          # if today's maintenance was already done by the nightly job.
          RUN_LOCK_EXTEND: "true"
          # SECONDARY (Kat's account) holds a small position (~5 GMT) alongside her
          # real one; leave anything under this many GMT alone. PRIMARY has no
          # threshold set, so every position on it is re-extended.
          LOCK_SKIP_THRESHOLD_SECONDARY: "50"
        run: python gomining_maintenance.py

      - name: Save this run's GoMining login (Actions cache)
        # Cache mode only. `always()` so a run that logged in fine but failed later still
        # leaves the newest login behind; the script only says cookies_updated=true when it
        # really saved a new one (never in secret mode).
        if: always() && steps.tap.outputs.cookies_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: cookie-cache
          key: gomining-login-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug-artifacts/
          retention-days: 7
